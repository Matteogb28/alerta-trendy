name: Vigilar Trendy

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (minimo permitido; GitHub puede retrasarlo)
  workflow_dispatch:
    inputs:
      modo:
        description: "revisar | test (prueba Telegram) | probe (prueba la tienda)"
        default: "revisar"

permissions:
  contents: write   # para guardar estado.json en el repo

concurrency:
  group: vigilar-trendy
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prueba de Telegram
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'test'
        run: python trendy_alerta.py --test

      - name: Sondeo de la tienda
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'probe'
        run: |
          python trendy_alerta.py --probe adviento
          python trendy_alerta.py --probe calendario

      - name: Revisar la tienda
        if: github.event_name == 'schedule' || inputs.modo == 'revisar'
        run: python trendy_alerta.py --una-vez

      - name: Guardar estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "alerta-trendy"
            git config user.email "alerta-trendy@users.noreply.github.com"
            git add estado.json
            git commit -m "estado [skip ci]"
            git pull --rebase
            git push
          fi
